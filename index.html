<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panic Cam - Control de Estrés</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 20px;
            color: #e54b4b;
        }

        .input-group {
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            font-size: 18px;
            letter-spacing: 4px;
            text-align: center;
            border: 2px solid #333;
            background-color: #2a2a2a;
            color: #fff;
            border-radius: 8px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #e54b4b;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #e54b4b;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #c0392b;
        }

        .status {
            margin-top: 15px;
            font-size: 14px;
            font-weight: 500;
        }

        .status.connected { color: #2ecc71; }
        .status.disconnected { color: #e74c3c; }

        .control-panel {
            display: none;
            margin-top: 25px;
            border-top: 1px solid #333;
            padding-top: 20px;
        }

        .slider-container {
            margin: 20px 0;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #e54b4b;
        }

        .stress-value {
            font-size: 32px;
            font-weight: bold;
            margin-top: 10px;
            color: #f39c12;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>PANIC CAM LINK</h1>

    <!-- FORMULARIO DE CONEXIÓN POR PIN -->
    <div id="login-section">
        <div class="input-group">
            <input type="text" id="pinInput" placeholder="1234" maxlength="4" autocomplete="off">
        </div>
        <button onclick="conectarPin()">CONECTAR CON ROBLOX</button>
        <div id="statusMessage" class="status disconnected">Esperando PIN...</div>
    </div>

    <!-- PANEL DE CONTROL UNA VEZ CONECTADO -->
    <div id="control-section" class="control-panel">
        <p>Conectado correctamente 🎉</p>
        <div class="slider-container">
            <label for="stressSlider">Nivel de Estrés:</label>
            <input type="range" id="stressSlider" min="0" max="100" value="0" oninput="actualizarEstrés(this.value)">
            <div id="stressDisplay" class="stress-value">0%</div>
        </div>
    </div>
</div>

<script>
    // CAMBIÁ ESTA URL POR LA DE TU SERVIDOR EN RENDER / NGROK
    const SERVER_URL = "http://localhost:8000"; 

    let activePin = null;

    async function conectarPin() {
        const pinInput = document.getElementById("pinInput");
        const statusMessage = document.getElementById("statusMessage");
        const rawPin = pinInput.value.trim();

        if (!rawPin) {
            statusMessage.innerText = "⚠️ Ingresá un PIN válido";
            statusMessage.className = "status disconnected";
            return;
        }

        statusMessage.innerText = "Conectando...";
        statusMessage.className = "status";

        try {
            const response = await fetch(`${SERVER_URL}/api/link-pin`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ pin: String(rawPin) })
            });

            const data = await response.json();

            if (response.ok && data.success) {
                activePin = rawPin;
                statusMessage.innerText = "🟢 PIN Vinculado con Éxito";
                statusMessage.className = "status connected";

                // Ocultar login y mostrar slider
                document.getElementById("login-section").style.display = "none";
                document.getElementById("control-section").style.display = "block";
            } else {
                statusMessage.innerText = `❌ ${data.detail || "PIN incorrecto"}`;
                statusMessage.className = "status disconnected";
            }
        } catch (error) {
            console.error("Error:", error);
            statusMessage.innerText = "❌ Error de conexión con el servidor";
            statusMessage.className = "status disconnected";
        }
    }

    async function actualizarEstrés(valor) {
        document.getElementById("stressDisplay").innerText = `${valor}%`;

        if (!activePin) return;

        try {
            await fetch(`${SERVER_URL}/api/update-state`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    pin: String(activePin),
                    stress: parseInt(valor)
                })
            });
        } catch (error) {
            console.error("Error al enviar estrés:", error);
        }
    }
</script>

</body>
</html>
