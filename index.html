<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PANIC CAM - AUTOMATIC DETECTOR</title>
    <style>
        :root {
            --primary-red: #ff2a2a;
            --bg-dark: #0a0a0c;
            --panel-bg: #121318;
            --text-main: #e0e0e0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .screen-container {
            width: 100%;
            max-width: 480px;
            background: var(--panel-bg);
            border: 2px solid #2a2c35;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.15);
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2c35;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .title {
            color: var(--primary-red);
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .rec-dot {
            width: 12px;
            height: 12px;
            background-color: var(--primary-red);
            border-radius: 50%;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        .timestamp {
            font-size: 11px;
            color: #888;
        }

        /* LOGIN / PIN SCREEN */
        .pin-overlay {
            display: flex;
            flex-direction: column;
            gap: 15px;
            text-align: center;
            margin: 20px 0;
        }

        .pin-overlay p {
            font-size: 13px;
            color: #aaa;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            font-size: 24px;
            letter-spacing: 8px;
            text-align: center;
            border: 2px solid #333;
            background-color: #050507;
            color: var(--primary-red);
            border-radius: 8px;
            outline: none;
            font-weight: bold;
        }

        input[type="text"]:focus {
            border-color: var(--primary-red);
            box-shadow: 0 0 10px rgba(255, 42, 42, 0.3);
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(180deg, #ff2a2a 0%, #a80000 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            transition: transform 0.1s, filter 0.2s;
        }

        button:hover { filter: brightness(1.2); }
        button:active { transform: scale(0.98); }

        .status-msg {
            font-size: 12px;
            color: #777;
            min-height: 16px;
        }

        /* CAM SYSTEM */
        .cam-wrapper {
            display: none;
            position: relative;
            width: 100%;
            height: 260px;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #333;
            margin-bottom: 20px;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        .cam-hud {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            font-size: 11px;
            color: #00ff66;
            text-shadow: 0 0 4px #000;
        }

        .cam-hud .live-tag {
            background: rgba(0,0,0,0.6);
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* CHEAT WARNING OVERLAY */
        .cheat-warning {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 0, 0, 0.4);
            color: #fff;
            font-weight: bold;
            font-size: 14px;
            text-align: center;
            justify-content: center;
            align-items: center;
            text-shadow: 0 0 8px #000;
            letter-spacing: 1px;
        }

        /* BARRA DE PÁNICO AUTOMÁTICA */
        .stress-section {
            display: none;
            margin-top: 10px;
        }

        .stress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .stress-label {
            font-size: 14px;
            font-weight: bold;
            color: #ddd;
            letter-spacing: 1px;
        }

        .stress-value-text {
            font-size: 22px;
            font-weight: bold;
            color: var(--primary-red);
            text-shadow: 0 0 8px rgba(255, 42, 42, 0.5);
        }

        .panic-bar-visual {
            width: 100%;
            height: 16px;
            background: #1a1a22;
            border-radius: 8px;
            overflow: hidden;
            margin-top: 8px;
            border: 1px solid #333;
        }

        .panic-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #2ecc71 0%, #f39c12 50%, #ff2a2a 100%);
            box-shadow: 0 0 10px rgba(255, 42, 42, 0.8);
            transition: width 0.15s linear;
        }

        .state-description {
            font-size: 12px;
            color: #aaa;
            margin-top: 8px;
            text-align: center;
        }
    </style>

    <!-- Scripts de MediaPipe para detección facial -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body>

<div class="screen-container">
    <div class="header">
        <div class="title">
            <div class="rec-dot"></div>
            PANIC CAM AI
        </div>
        <div class="timestamp" id="clock">00:00:00</div>
    </div>

    <!-- SECCIÓN 1: VINCULAR CON PIN -->
    <div id="loginSection" class="pin-overlay">
        <p>INGRESA EL PIN GENERADO EN ROBLOX</p>
        <input type="text" id="pinInput" placeholder="0000" maxlength="4" autocomplete="off">
        <button onclick="conectarServidor()">VINCULAR CÁMARA</button>
        <div id="statusMsg" class="status-msg">Esperando conexión...</div>
    </div>

    <!-- SECCIÓN 2: CÁMARA EN VIVO -->
    <div id="camWrapper" class="cam-wrapper">
        <video id="webcam" autoplay playsinline muted></video>
        <div class="cam-hud">
            <span class="live-tag">● AI TRACKING</span>
            <span id="camPinTag">PIN: ----</span>
        </div>
        <div id="cheatWarning" class="cheat-warning">⚠️ ¡CARA NO DETECTADA!<br>PÁNICO AL 100% (ANTI-TRAMPA)</div>
    </div>

    <!-- SECCIÓN 3: BARRA DE PÁNICO AUTOMÁTICA -->
    <div id="stressSection" class="stress-section">
        <div class="stress-header">
            <span class="stress-label">MEDIDOR DE PÁNICO</span>
            <span id="stressVal" class="stress-value-text">0%</span>
        </div>

        <div class="panic-bar-visual">
            <div id="panicFill" class="panic-bar-fill"></div>
        </div>

        <div id="stateDesc" class="state-description">🟢 Estado: Tranquilo</div>
    </div>
</div>

<script>
    const SERVER_URL = "https://roblox-cam-backend.onrender.com";

    let activePin = null;
    let targetStress = 0;
    let currentStress = 0;
    let prevHeadPos = null;

    // Reloj en tiempo real
    function updateClock() {
        const now = new Date();
        document.getElementById("clock").innerText = now.toTimeString().split(' ')[0];
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Bucle continuo para suavizar la barra y enviarla a Render
    setInterval(() => {
        if (!activePin) return;

        // Interpolación suave (Lerp) para que la barra no pegue saltos bruscos
        currentStress += (targetStress - currentStress) * 0.2;
        const displayVal = Math.round(currentStress);

        document.getElementById("stressVal").innerText = `${displayVal}%`;
        document.getElementById("panicFill").style.width = `${displayVal}%`;

        const desc = document.getElementById("stateDesc");
        if (displayVal <= 30) {
            desc.innerText = "🟢 Estado: Tranquilo";
            desc.style.color = "#2ecc71";
        } else if (displayVal <= 60) {
            desc.innerText = "🟡 Estado: Nervioso / Alerta";
            desc.style.color = "#f39c12";
        } else {
            desc.innerText = "🔴 Estado: PÁNICO TOTAL";
            desc.style.color = "#ff2a2a";
        }

        // Enviar al servidor Python en Render
        enviarEstresAlServidor(displayVal);
    }, 120);

    async function enviarEstresAlServidor(valor) {
        try {
            await fetch(`${SERVER_URL}/api/update-state`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    pin: String(activePin),
                    stress: parseInt(valor)
                })
            });
        } catch (err) {}
    }

    // Vincular PIN
    async function conectarServidor() {
        const pinInput = document.getElementById("pinInput");
        const statusMsg = document.getElementById("statusMsg");
        const pin = pinInput.value.trim();

        if (!pin) {
            statusMsg.innerText = "⚠️ Ingresá un PIN válido";
            statusMsg.style.color = "#ff2a2a";
            return;
        }

        statusMsg.innerText = "Conectando con Render...";
        statusMsg.style.color = "#f39c12";

        try {
            const response = await fetch(`${SERVER_URL}/api/link-pin`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ pin: String(pin) })
            });

            const data = await response.json();

            if (response.ok && data.success) {
                activePin = pin;
                statusMsg.innerText = "🟢 Conectado con exito";

                document.getElementById("loginSection").style.display = "none";
                document.getElementById("camWrapper").style.display = "block";
                document.getElementById("stressSection").style.display = "block";
                document.getElementById("camPinTag").innerText = `PIN: ${pin}`;

                iniciarMediaPipe();
            } else {
                statusMsg.innerText = `❌ ${data.detail || "PIN incorrecto"}`;
                statusMsg.style.color = "#ff2a2a";
            }
        } catch (error) {
            statusMsg.innerText = "❌ Error de conexión con Render";
            statusMsg.style.color = "#ff2a2a";
        }
    }

    // DISTANCIA MATEMÁTICA ENTRE PUNTOS DE LA CARA
    function dist(p1, p2) {
        return Math.hypot(p1.x - p2.x, p1.y - p2.y);
    }

    // LÓGICA DE PROCESAMIENTO FACIAL
    function onFaceMeshResults(results) {
        const cheatOverlay = document.getElementById("cheatWarning");

        -- SI NO SE DETECTA CARA = TRAMPA / PÁNICO 100% --
        if (!results.multiFaceLandmarks || results.multiFaceLandmarks.length === 0) {
            targetStress = 100;
            cheatOverlay.style.display = "flex";
            prevHeadPos = null;
            return;
        }

        cheatOverlay.style.display = "none";
        const lm = results.multiFaceLandmarks[0];

        // Alto total de la cara para normalizar proporciones
        const altoCara = dist(lm[10], lm[152]);
        if (!altoCara) return;

        // 1. Boca Abierta (Grito / Susto) - Poco estricto
        const aperturaBoca = dist(lm[13], lm[14]) / altoCara;
        let ptsBoca = Math.min(45, Math.max(0, (aperturaBoca - 0.05) * 350));

        // 2. Ojos Desorbitados / Cejas levantadas
        const ojoIzk = dist(lm[159], lm[145]);
        const ojoDer = dist(lm[386], lm[374]);
        const aperturaOjos = ((ojoIzk + ojoDer) / 2) / altoCara;
        let ptsOjos = Math.min(35, Math.max(0, (aperturaOjos - 0.045) * 400));

        // 3. Movimientos bruscos de la cabeza
        const centroCara = { x: lm[1].x, y: lm[1].y };
        let ptsMovimiento = 0;
        if (prevHeadPos) {
            const desplazamiento = dist(centroCara, prevHeadPos) / altoCara;
            ptsMovimiento = Math.min(30, desplazamiento * 150);
        }
        prevHeadPos = centroCara;

        // Total calculado (0 a 100)
        let total = Math.round(ptsBoca + ptsOjos + ptsMovimiento);
        targetStress = Math.min(100, Math.max(0, total));
    }

    // INICIALIZACIÓN DE MEDIAPIPE Y CÁMARA
    function iniciarMediaPipe() {
        const videoElement = document.getElementById("webcam");

        const faceMesh = new FaceMesh({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
        });

        faceMesh.setOptions({
            maxNumFaces: 1,
            refineLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        faceMesh.onResults(onFaceMeshResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await faceMesh.send({ image: videoElement });
            },
            width: 640,
            height: 480
        });

        camera.start();
    }
</script>

</body>
</html>
